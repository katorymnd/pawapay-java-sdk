name: Build Native Core Binaries

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CRATE_NAME: katorymnd_pawapay_core
  FINAL_NAME: pawapay

jobs:
  build-native:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # =========================
          # Windows
          # =========================
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: dll
            prefix: ""

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: dll
            prefix: ""

          # =========================
          # macOS
          # =========================
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: dylib
            prefix: lib

          - os: macos-latest
            target: aarch64-apple-darwin
            ext: dylib
            prefix: lib

          # =========================
          # Linux GNU
          # =========================
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: so
            prefix: lib

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: so
            prefix: lib

          

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross for Linux
        if: runner.os == 'Linux'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with Cargo (Windows & macOS)
        if: runner.os != 'Linux'
        working-directory: core-rust
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build with Cross (Linux)
        if: runner.os == 'Linux'
        working-directory: core-rust
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare Output Directory
        shell: bash
        run: |
          mkdir -p bin_output/${{ matrix.target }}
          SOURCE_FILE="core-rust/target/${{ matrix.target }}/release/${{ matrix.prefix }}${{ env.CRATE_NAME }}.${{ matrix.ext }}"
          TARGET_FILE="bin_output/${{ matrix.target }}/${{ matrix.prefix }}${{ env.FINAL_NAME }}.${{ matrix.ext }}"
          
          echo "Source File:"
          echo "$SOURCE_FILE"
          echo "Target File:"
          echo "$TARGET_FILE"
          
          cp "$SOURCE_FILE" "$TARGET_FILE"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: bin_output/${{ matrix.target }}/
          if-no-files-found: error

  package-universal-runtime:
    name: Package Universal Runtime
    needs: build-native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: core-rust/temp_builds

      - name: Normalize Target Structure
        shell: bash
        run: |
          mkdir -p core-rust/universal_runtime
          
          echo "=== Normalizing Target Directory Names ==="
          for dir in core-rust/temp_builds/native-*; do
            if [ -d "$dir" ]; then
              # Extract the target triple (e.g., x86_64-pc-windows-msvc)
              TARGET_TRIPLE=$(basename "$dir" | sed 's/native-//')
              echo "Processing: $TARGET_TRIPLE"
              
              # Create matching target folder in final directory
              mkdir -p "core-rust/universal_runtime/$TARGET_TRIPLE"
              
              # Copy files over cleanly
              cp -r "$dir"/* "core-rust/universal_runtime/$TARGET_TRIPLE/"
            fi
          done

      - name: Show Final Layout
        shell: bash
        run: |
          echo "===================================="
          echo "FINAL UNIVERSAL RUNTIME STRUCTURE"
          echo "===================================="
          find core-rust/universal_runtime

      - name: Upload Universal Runtime
        uses: actions/upload-artifact@v4
        with:
          name: universal-native-runtime
          path: core-rust/universal_runtime/